<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>全息数字人</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="light">

  <!-- 形象渲染层 -->
  <canvas id="stage"></canvas>

  <!-- 扫描线与暗角，纯 CSS 合成，不占渲染循环 -->
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- 顶部状态 -->
  <div class="hud-top">
    <div id="status" class="status"><span class="dot"></span><span id="statusText">启动中</span></div>
  </div>

  <!-- 右上角设置入口 -->
  <button id="btn-settings" class="gear" aria-label="设置">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"></path>
    </svg>
  </button>

  <!-- 功能标签 -->
  <div id="tags" class="tags"></div>

  <!-- 字幕 -->
  <div id="caption" class="caption"></div>

  <!-- 待机提示 -->
  <div id="hint" class="hint">说句话，试着和我聊聊</div>

  <!-- 设置面板 -->
  <div id="settings" class="sheet hidden">
    <div class="sheet-inner">
      <h2>设备配置</h2>

      <label>Workspace ID</label>
      <input id="f-workspace" type="text" placeholder="例如 llm-xxxxxxxxxxxx" autocomplete="off">

      <label>API Key</label>
      <input id="f-key" type="password" placeholder="sk-..." autocomplete="off">

      <label>地域</label>
      <select id="f-region">
        <option value="cn-beijing">北京</option>
        <option value="ap-southeast-1">新加坡</option>
      </select>

      <label>音色</label>
      <input id="f-voice" type="text" placeholder="Tina" autocomplete="off">

      <label>人设（System Prompt）</label>
      <textarea id="f-instructions" rows="5"></textarea>

      <div class="row">
        <button id="btn-save" class="primary">保存并开始</button>
        <button id="btn-cancel">取消</button>
      </div>

      <p class="tip">
        提示：长按屏幕 5 秒可重新打开此面板。
        Key 仅保存在本机，请勿在公共设备上使用长期 Key。
      </p>
    </div>
  </div>

  <script src="js/avatar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
